<!doctype html>
<!--
  llmrouter API reference.

  Swagger UI 5.33.3, loaded from the jsDelivr CDN. Each integrity value is
  the sha384 digest of the exact file at that URL, so the browser refuses a
  tampered copy; if the version changes, change both hashes with it.
-->
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>llmrouter API reference</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.3/swagger-ui.css"
      integrity="sha384-Ov4/wv3j2bmct8cDc5X4ngJZohVPzEmc6uDPH8WeljUxO5vtoykvMEfbu9Vh6RaW"
      crossorigin="anonymous"
    />
    <style>
      body {
        margin: 0;
      }
      #swagger-ui .topbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script
      src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.3/swagger-ui-bundle.js"
      integrity="sha384-h00llMzD1afyNow1pDmnZKlHsUZgp9KE9HXLFXF2CvbwsBY0+WBO4f75SfGwvM4K"
      crossorigin="anonymous"
    ></script>
    <script>
      window.addEventListener("load", () => {
        window.ui = SwaggerUIBundle({
          url: '/openapi.json',
          dom_id: '#swagger-ui',
          tryItOutEnabled: true,
          docExpansion: 'none',
        });
      });
    </script>
  </body>
</html>

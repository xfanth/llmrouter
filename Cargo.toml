[package]
name = "llmrouter"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Fast, lightweight LLM router: races many provider/model/key channels, returns the first good answer"
license = "MIT"

[dependencies]
# Runtime
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"

# HTTP server
axum = { version = "0.8", features = ["json", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
hyper = "1.6"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = [
    "json", "stream", "http2", "rustls-tls", "gzip",
] }

# Wire-format translation, Anthropic <-> OpenAI
switchyard-translation = "0.3"
switchyard-protocol = "0.3"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
humantime-serde = "1"

# Storage
redb = "2.6"
blake3 = "1.5"

# State
arc-swap = "1.7"
dashmap = "6"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# Misc
anyhow = "1"
thiserror = "2"
bytes = "1"
rand = "0.8"
csv = "1.3"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
tokio-test = "0.4"
# `ServiceExt::oneshot`, so a test can drive the router without a socket.
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

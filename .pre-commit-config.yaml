default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        files: '\.rs$'
        pass_filenames: false
        stages: [pre-commit]

      - id: verify-tracked-sources
        name: verify build sources tracked
        entry: bash -c '! git ls-files --others --exclude-standard -- src tests static Cargo.toml Cargo.lock rust-toolchain.toml Dockerfile docker-compose.yml docker-compose.ci.yml | grep -q .'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: full-ci-gate
        name: full CI gate (ci.sh)
        entry: ./ci.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

name: publish

# Publishes the image to ghcr after a green CI run on master, which is what a
# merged PR produces. The NAS pulls this image; it does not build.
#
# `workflow_run` is what makes "merged" the trigger rather than "pushed":
# CI on master runs on every push, and this workflow starts only when that
# run reaches a green conclusion. A push whose CI fails never publishes.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

# The image is published with the workflow's own token, so the workflow needs
# packages: write. The checkout is the ref CI just tested.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    # A cancelled or failed CI run never publishes.
    if: github.event.workflow_run.conclusion == 'success'
    name: build and push to ghcr
    # The organisation's self-hosted runner: GitHub-hosted runners fail at
    # startup for this repository. The runner has a working docker daemon
    # and the compose plugin is installed by the gate.
    runs-on: [self-hosted, Linux, X64, truenas]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run fires on the default branch's own ref, but pin it
          # anyway so the checkout is unambiguous about what CI tested.
          ref: ${{ github.event.workflow_run.head_sha }}

      # macbre/push-to-ghcr builds the image, logs in to ghcr.io with the
      # workflow's own token and pushes. Setting platforms keeps it on the
      # buildx path, whose registry cache reuses the previous :latest's
      # dependency layers, so an unchanged Cargo.lock does not recompile.
      - name: Build and publish
        uses: macbre/push-to-ghcr@v18
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          image_name: ${{ github.repository }}
          image_tag: latest,sha-${{ github.event.workflow_run.head_sha }}
          platforms: linux/amd64
          context: .

name: publish

# Publishes the image to ghcr after a green CI run on master, which is what a
# merged PR produces. The NAS pulls this image; it does not build.
#
# `workflow_run` is what makes "merged" the trigger rather than "pushed":
# CI on master runs on every push, and this workflow starts only when that
# run reaches a green conclusion. A push whose CI fails never publishes.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

# The image is published with the workflow's own token, so the workflow needs
# packages: write. The checkout is the ref CI just tested.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    # A cancelled or failed CI run never publishes.
    if: github.event.workflow_run.conclusion == 'success'
    name: build and push to ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run fires on the default branch's own ref, but pin it
          # anyway so the checkout is unambiguous about what CI tested.
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The smoke tier already built this commit in CI, but its gha cache
      # lives in a different scope, so this build runs warm from the publish
      # scope's own history instead of sharing CI's.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/xfanth/llmrouter:latest
            ghcr.io/xfanth/llmrouter:sha-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max

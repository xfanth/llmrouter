name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A new push to a pull request makes the running check pointless, so cancel
# it. Every other gate shares one queue: two simultaneous gates crossed the
# TrueNAS runner's memory cgroup on 21 Oct 2026 and both failed with the
# smoke tier dead, so a second gate waits for the first to finish instead of
# racing it on the one memory-capped machine.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'llmrouter-gate-serial' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The organisation's shared Rust gate: the repository's own ci.sh, run on
  # the TrueNAS self-hosted runner, so CI consumes no GitHub-hosted minutes.
  # The workflow lives in xfanth/.github; the branch ref tracks it until it
  # is tagged there.
  quality:
    name: quality gate
    uses: xfanth/.github/.github/workflows/rust-quality.yml@rust-quality

name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A new push to a pull request makes the running check pointless, so cancel it.
# Master pushes are never cancelled, so every commit on master gets its own
# complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The organisation's shared Rust gate: the repository's own ci.sh, run on
  # the TrueNAS self-hosted runner, so CI consumes no GitHub-hosted minutes.
  # The workflow lives in xfanth/.github; the branch ref tracks it until it
  # is tagged there.
  quality:
    name: quality gate
    uses: xfanth/.github/.github/workflows/rust-quality.yml@rust-quality

name: CI

on:
  pull_request:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      # The target dir has to stay inside the checkout. rust-cache joins the
      # workspace root with the target path, so an absolute path would resolve
      # to a directory that never exists and nothing of the build is cached.
      - name: Cache cargo and the target dir
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --lib --bins --test contract --test integration

      - name: Coverage, with the 80/80 gate
        run: |
          # Matches ci.sh. rust-cache restores target/ between runs, so
          # profile data from an earlier run can survive and skew the figure.
          cargo llvm-cov clean --workspace
          cargo llvm-cov --all-features --workspace --no-report \
            --lib --bins --test contract --test integration
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only \
            --fail-under-lines 80 --fail-under-regions 80

      - name: Upload the lcov report
        # Wanted even when the gate fails: that is when you want to read it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  smoke:
    name: smoke tier (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and the target dir
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: smoke

      - name: Cache the image build layers
        uses: docker/setup-buildx-action@v3

      - name: Run the smoke tier
        run: cargo test --test smoke -- --nocapture

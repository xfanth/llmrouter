name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Cancel any running workflow on the same branch when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.1.0
        with:
          enable-cache: true
      - name: Run pre-commit
        run: uvx --with pre-commit-uv pre-commit run --all-files --show-diff-on-failure

  tracked:
    name: tracked source files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Verify build sources tracked
        run: |
          untracked=$(git ls-files --others --exclude-standard -- \
            src tests static Cargo.toml Cargo.lock rust-toolchain.toml Dockerfile \
            docker-compose.yml docker-compose.ci.yml)
          if [ -n "$untracked" ]; then
            echo "FAIL: these files are not in git, so CI will never see them:"
            echo "$untracked" | sed 's/^/         /'
            echo "         Run: git add <file>"
            exit 1
          fi

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy & make-config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.7.7
        with:
          workspaces: ". -> target"
          key: clippy
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo build --release --bin llmrouter-make-config
        run: cargo build --release --bin llmrouter-make-config

  coverage:
    name: tests & coverage (80/80 gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.7.7
        with:
          workspaces: ". -> target"
          key: coverage
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.49.25
        with:
          tool: cargo-nextest@0.9.148,cargo-llvm-cov@0.9.1
      - name: Tests under coverage, with the 80/80 gate
        run: |
          cargo llvm-cov clean --workspace --profraw-only
          rm -f target/llvm-cov-target/*.profdata
          cargo llvm-cov nextest --all-features --workspace --no-report \
            --lib --bins --test contract --test integration
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only \
            --fail-under-lines 80 --fail-under-regions 80
      - name: Upload the lcov report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: lcov
          path: lcov.info

  smoke:
    name: smoke tier (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.7.7
        with:
          workspaces: ". -> target"
          key: smoke
      - name: Run the smoke tier
        env:
          CI: "1"
          COMPOSE_PROJECT_NAME: "llmrouter-smoke-${{ github.run_id }}"
        run: cargo test --test smoke -- --nocapture

  ci:
    name: ci summary
    if: always()
    needs: [pre-commit, tracked, fmt, clippy, coverage, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "every job passed"

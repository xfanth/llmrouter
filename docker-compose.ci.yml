# Overlay for the smoke tier. The production compose file mounts host paths
# that only exist on the NAS, so CI swaps them for a fixture config directory
# and a throwaway named volume.
#
#   COMPOSE_PROJECT_NAME=smoke docker compose -f docker-compose.yml \
#     -f docker-compose.ci.yml up -d --build
#
# COMPOSE_PROJECT_NAME must be set: it names the smoke image (below) and the
# project, and ci.sh plus the smoke test both set it from the checkout path.
services:
  llmrouter:
    # The smoke tier builds from this checkout, never pulls from ghcr, and
    # never tags the shared ghcr name: a fixed image name is global to the
    # daemon, so two checkouts running the tier at once would retag one
    # another's binary between build and a later container create. The
    # project name, which ci.sh and the smoke test both set from the full
    # checkout path, keeps the image name per checkout too.
    build: .
    image: llmrouter-smoke-${COMPOSE_PROJECT_NAME}
    volumes:
      - ./tests/smoke/fixture-config:/config:ro
      - smoke-data:/data
    # The base file restarts the container for ever. A smoke container that
    # outlives its run would come back after a daemon restart and sit on the
    # published port, so the overlay turns the policy off.
    restart: !override "no"
    # `!override` replaces the inherited list. Without the tag Compose
    # concatenates, and the service ends up publishing 8080 twice: once on
    # 0.0.0.0 from the base file and once here, so the second bind fails.
    #
    # No host port is pinned. A fixed 8080 races every other thing on the
    # machine that might hold it: a leftover container, a locally running
    # router, a second checkout running this same tier. The kernel picks a
    # free port and the test reads it back with `docker compose port`.
    ports: !override
      - "127.0.0.1::8080"

  # A curl sidecar joined to the router's own network stack. On runners
  # whose docker daemon publishes no working route to the container - the
  # organisation's self-hosted runner behaves so - the smoke test checks the
  # endpoints by exec-ing curl here: same network namespace as the router,
  # nothing needed but loopback. The sleep keeps it alive for the run.
  curl-sidecar:
    image: curlimages/curl:latest
    network_mode: "service:llmrouter"
    entrypoint: ["sleep", "infinity"]
    restart: !override "no"
    depends_on:
      - llmrouter

volumes:
  smoke-data:
